name: Windows delivery

# Build a tested revision on demand. This produces an artifact; it does not publish a release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-player:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run fast logic gate
        run: dotnet run --project CI/LogicTests -c Release
      - uses: actions/cache@v4
        with:
          path: Library
          key: unity-windows-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json') }}-${{ github.sha }}
          restore-keys: |
            unity-windows-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json') }}-
      - name: Validate map and build Windows player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildMethod: RushedCrops.Editor.WorldBuildChecks.BuildWindows
      - name: Retain Windows player
        uses: actions/upload-artifact@v4
        with:
          name: RushedCrops-Windows-${{ github.sha }}
          path: Builds/Windows
          if-no-files-found: error
      - name: Retain Unity logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unity-logs-${{ github.sha }}
          path: |
            artifacts
            Logs
          if-no-files-found: ignore
